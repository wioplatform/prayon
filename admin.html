<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fff8fc">
  <title>PRAY ON 관리자</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;background:#fff8fc;color:#252329;
      font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Segoe UI",sans-serif;
    }
    .wrap{width:min(100% - 28px,920px);margin:0 auto;padding:30px 0 70px}
    header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}
    .brand{font-weight:950;font-size:25px;letter-spacing:-1px}
    .home{color:#8b6b7f;text-decoration:none;font-size:13px}
    .panel{
      background:white;border:1px solid #f1d5e5;border-radius:28px;padding:26px;
      box-shadow:0 18px 48px rgba(80,45,68,.08);margin-bottom:22px;
    }
    h1,h2{margin:0 0 10px;letter-spacing:-1px}
    p{color:#77747d;line-height:1.7}
    label{display:block;font-weight:850;margin:17px 0 8px}
    input,textarea,select{
      width:100%;padding:15px 16px;border:1px solid #e5dbe1;border-radius:15px;
      background:#fbfafb;font:inherit;outline:none;color:#252329;
    }
    textarea{min-height:118px;resize:vertical;line-height:1.65}
    input:focus,textarea:focus,select:focus{
      border-color:#df83b6;box-shadow:0 0 0 4px #f8dbea
    }
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
    .span-2{grid-column:1/-1}
    .prayer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .prayer-field{
      padding:16px;border:1px solid #eee4ea;border-radius:18px;background:#fffafb
    }
    .prayer-field label{margin-top:0}
    .check-row{display:flex;align-items:center;gap:10px;margin-top:18px}
    .check-row input{width:20px;height:20px}
    .button-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
    .button-row .primary{width:auto;margin-top:0;flex:1}
    .history{display:grid;gap:10px;margin-top:18px}
    .history-item{
      display:flex;justify-content:space-between;align-items:center;gap:12px;
      padding:14px 16px;border:1px solid #eee4ea;border-radius:16px;background:#fbfafb
    }
    .history-main{min-width:0}
    .history-title{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .history-meta{font-size:12px;color:#96939b;margin-top:4px}
    .published-badge{
      display:inline-flex;margin-left:6px;padding:3px 7px;border-radius:999px;
      background:#eaf8ef;color:#3f7a55;font-size:10px;font-weight:900
    }
    .divider{height:1px;background:#eee7eb;margin:28px 0}
    @media(max-width:680px){
      .form-grid,.prayer-grid{grid-template-columns:1fr}
      .span-2{grid-column:auto}
    }
    button{
      border:0;border-radius:15px;padding:14px 17px;font:inherit;font-weight:900;cursor:pointer;
    }
    .primary{background:#d96fa9;color:white;width:100%;margin-top:18px}
    .secondary{background:#f7e5ef;color:#5f3d51}
    .danger{background:#fff0f1;color:#b94353}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
    .hidden{display:none!important}
    .status{min-height:22px;margin-top:12px;font-size:13px;font-weight:800;color:#b94353}
    .list{display:grid;gap:14px;margin-top:20px}
    .item{
      border:1px solid #eee4ea;border-radius:20px;padding:18px;background:#fff;
      display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;
    }
    .content{white-space:pre-wrap;line-height:1.75;font-size:15px}
    .meta{color:#9b98a0;font-size:12px;margin-top:9px}
    .empty{text-align:center;padding:34px;color:#96939b}
    @media(max-width:560px){
      .item{grid-template-columns:1fr}
      .danger{width:100%}
      .history-item{align-items:flex-start;flex-direction:column}
    }
      .report-badge{
      display:inline-flex;align-items:center;margin-left:8px;padding:4px 8px;
      border-radius:999px;background:#fff0f2;color:#b94353;font-size:11px;font-weight:900
    }
</style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="brand">PRAY ON · ADMIN</div>
      <a class="home" href="index.html">사용자 페이지로</a>
    </header>

    <section class="panel" id="loginPanel">
      <h1>관리자 로그인</h1>
      <p>Supabase Authentication에 등록한 관리자 이메일과 비밀번호를 입력하세요.</p>
      <form id="loginForm">
        <label for="email">이메일</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="password">비밀번호</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button class="primary" type="submit">로그인</button>
      </form>
      <div class="status" id="loginStatus"></div>
    </section>


    <section class="panel hidden" id="weeklyPanel">
      <div class="toolbar">
        <div>
          <h2>이번 주 말씀·기도 관리</h2>
          <p>저장 후 ‘공개’를 체크하면 사용자 페이지에 가장 최근 주차의 내용이 자동으로 표시됩니다.</p>
        </div>
        <button class="secondary" id="newWeekBtn" type="button">새 주 작성</button>
      </div>

      <form id="weeklyForm">
        <input id="weeklyId" type="hidden">

        <div class="form-grid">
          <div>
            <label for="messageDate">주일 날짜</label>
            <input id="messageDate" type="date" required>
          </div>
          <div>
            <label for="serviceLabel">예배 구분</label>
            <input id="serviceLabel" type="text" value="주일 1부 예배" maxlength="80" required>
          </div>

          <div class="span-2">
            <label for="messageTitle">강단 메시지 제목</label>
            <input id="messageTitle" type="text" maxlength="180" required>
          </div>

          <div>
            <label for="scripture">성경 본문</label>
            <input id="scripture" type="text" maxlength="120">
          </div>
          <div>
            <label for="keySentence">이번 주 핵심문장</label>
            <input id="keySentence" type="text" maxlength="500">
          </div>

          <div class="span-2">
            <label for="dailyPrayer">이미지 아래에 보일 기본 기도문</label>
            <textarea id="dailyPrayer" maxlength="1500"></textarea>
          </div>
        </div>

        <div class="divider"></div>

        <h2>상황별 기도문</h2>
        <p>아이들이 상황 버튼을 눌렀을 때 표시될 기도문입니다.</p>

        <div class="prayer-grid">
          <div class="prayer-field">
            <label for="prayerWorry">😟 걱정되고 불안할 때</label>
            <textarea id="prayerWorry" maxlength="1800"></textarea>
          </div>
          <div class="prayer-field">
            <label for="prayerHurt">💧 마음이 아플 때</label>
            <textarea id="prayerHurt" maxlength="1800"></textarea>
          </div>
          <div class="prayer-field">
            <label for="prayerAnger">🔥 화가 날 때</label>
            <textarea id="prayerAnger" maxlength="1800"></textarea>
          </div>
          <div class="prayer-field">
            <label for="prayerCourage">🌱 용기가 필요할 때</label>
            <textarea id="prayerCourage" maxlength="1800"></textarea>
          </div>
          <div class="prayer-field">
            <label for="prayerThanks">✨ 감사할 때</label>
            <textarea id="prayerThanks" maxlength="1800"></textarea>
          </div>
          <div class="prayer-field">
            <label for="prayerFriend">🤝 친구와 학교를 위해</label>
            <textarea id="prayerFriend" maxlength="1800"></textarea>
          </div>
        </div>

        <label class="check-row">
          <input id="isPublished" type="checkbox">
          <span>사용자 페이지에 공개</span>
        </label>

        <div class="button-row">
          <button class="primary" id="saveWeeklyBtn" type="submit">이번 주 내용 저장</button>
        </div>
      </form>

      <div class="status" id="weeklyStatus"></div>

      <div class="divider"></div>
      <h2>최근 작성 기록</h2>
      <div class="history" id="weeklyHistory"></div>
    </section>

    <section class="panel hidden" id="adminPanel">
      <div class="toolbar">
        <div>
          <h2>익명 기도함</h2>
          <p id="countText">기도제목을 불러오는 중입니다.</p>
        </div>
        <div>
          <button class="secondary" id="refreshBtn" type="button">새로고침</button>
          <button class="secondary" id="logoutBtn" type="button">로그아웃</button>
        </div>
      </div>
      <div class="status" id="adminStatus"></div>
      <div class="list" id="prayerList"></div>
    </section>
  </main>

<script>
(function(){
  const cfg = window.PRAYON_SUPABASE || {};
  const loginPanel = document.getElementById("loginPanel");
  const weeklyPanel = document.getElementById("weeklyPanel");
  const adminPanel = document.getElementById("adminPanel");
  const loginStatus = document.getElementById("loginStatus");
  const adminStatus = document.getElementById("adminStatus");
  const prayerList = document.getElementById("prayerList");
  const countText = document.getElementById("countText");
  const weeklyStatus = document.getElementById("weeklyStatus");
  const weeklyHistory = document.getElementById("weeklyHistory");
  const weeklyForm = document.getElementById("weeklyForm");

  if (!cfg.url || !cfg.publishableKey || cfg.publishableKey.includes("YOUR_")) {
    loginStatus.textContent = "config.js에 Project URL과 Publishable key를 먼저 입력해 주세요.";
    return;
  }
  const client = window.supabase.createClient(cfg.url, cfg.publishableKey);

  function showLogin(message){
    loginPanel.classList.remove("hidden");
    weeklyPanel.classList.add("hidden");
    adminPanel.classList.add("hidden");
    loginStatus.textContent = message || "";
  }

  async function verifyAdmin(){
    const { data: sessionData } = await client.auth.getSession();
    if (!sessionData.session) {
      showLogin("");
      return false;
    }

    const { data, error } = await client.rpc("is_admin");
    if (error || data !== true) {
      await client.auth.signOut();
      showLogin("관리자 권한이 없는 계정입니다.");
      return false;
    }

    loginPanel.classList.add("hidden");
    weeklyPanel.classList.remove("hidden");
    adminPanel.classList.remove("hidden");
    return true;
  }

  function formatDate(value){
    try {
      return new Intl.DateTimeFormat("ko-KR", {
        dateStyle:"medium", timeStyle:"short"
      }).format(new Date(value));
    } catch(e) { return value || ""; }
  }


  const weeklyFields = {
    id: document.getElementById("weeklyId"),
    messageDate: document.getElementById("messageDate"),
    serviceLabel: document.getElementById("serviceLabel"),
    messageTitle: document.getElementById("messageTitle"),
    scripture: document.getElementById("scripture"),
    keySentence: document.getElementById("keySentence"),
    dailyPrayer: document.getElementById("dailyPrayer"),
    prayerWorry: document.getElementById("prayerWorry"),
    prayerHurt: document.getElementById("prayerHurt"),
    prayerAnger: document.getElementById("prayerAnger"),
    prayerCourage: document.getElementById("prayerCourage"),
    prayerThanks: document.getElementById("prayerThanks"),
    prayerFriend: document.getElementById("prayerFriend"),
    isPublished: document.getElementById("isPublished")
  };

  const fallbackWeekly = {
    service_label:"주일 1부 예배",
    message_title:"미래를 미리 본 자들",
    scripture:"사도행전 2:17-18",
    key_sentence:"문제를 피하려고만 하지 말고, 그 속으로 들어가 하나님이 주시는 평생의 답을 찾아요.",
    daily_prayer:"하나님, 제가 피하고 싶은 문제 앞에서 도망가지 않게 해 주세요. 바울처럼 그 속에서 기도하며 하나님이 주시는 평생의 답을 찾게 해 주세요.",
    prayer_worry:"하나님, 지금 제 마음에 걱정과 불안이 있습니다. 말씀을 붙잡고 그 속에서 하나님의 답을 찾게 해 주세요. 두려움보다 하나님을 더 크게 바라보게 해 주세요. 예수 그리스도 이름으로 기도합니다. 아멘.",
    prayer_hurt:"하나님, 지금 제 마음이 아프고 속상합니다. 상처를 하나님 앞에 솔직히 내려놓고, 이 시간을 치유와 사람을 살리는 힘으로 바꾸어 주세요. 예수 그리스도 이름으로 기도합니다. 아멘.",
    prayer_anger:"하나님, 지금 제 안에 화가 있습니다. 감정대로 말하거나 행동하지 않고 말씀을 기억하며 하나님이 원하시는 방법으로 풀어가게 해 주세요. 예수 그리스도 이름으로 기도합니다. 아멘.",
    prayer_courage:"하나님, 해야 할 일을 알지만 용기가 부족합니다. 하나님이 주시는 힘으로 한 걸음 나아가고 이 문제 속에서 새로운 시작을 발견하게 해 주세요. 예수 그리스도 이름으로 기도합니다. 아멘.",
    prayer_thanks:"하나님, 오늘 감사할 일을 주셔서 감사합니다. 받은 힘과 기쁨을 친구와 나누고 사람을 살리는 선택을 하게 해 주세요. 예수 그리스도 이름으로 기도합니다. 아멘.",
    prayer_friend:"하나님, 제 친구와 학교를 위해 기도합니다. 친구들의 이야기를 먼저 듣고 이해하며 제가 사람을 살리는 작은 시작이 되게 해 주세요. 예수 그리스도 이름으로 기도합니다. 아멘."
  };

  function todayDate(){
    return new Date().toISOString().slice(0,10);
  }

  function fillWeeklyForm(row){
    const data = row || fallbackWeekly;
    weeklyFields.id.value = data.id || "";
    weeklyFields.messageDate.value = data.message_date || todayDate();
    weeklyFields.serviceLabel.value = data.service_label || "주일 1부 예배";
    weeklyFields.messageTitle.value = data.message_title || "";
    weeklyFields.scripture.value = data.scripture || "";
    weeklyFields.keySentence.value = data.key_sentence || "";
    weeklyFields.dailyPrayer.value = data.daily_prayer || "";
    weeklyFields.prayerWorry.value = data.prayer_worry || "";
    weeklyFields.prayerHurt.value = data.prayer_hurt || "";
    weeklyFields.prayerAnger.value = data.prayer_anger || "";
    weeklyFields.prayerCourage.value = data.prayer_courage || "";
    weeklyFields.prayerThanks.value = data.prayer_thanks || "";
    weeklyFields.prayerFriend.value = data.prayer_friend || "";
    weeklyFields.isPublished.checked = Boolean(data.is_published);
    weeklyStatus.textContent = "";
  }

  function weeklyPayload(){
    return {
      message_date: weeklyFields.messageDate.value,
      service_label: weeklyFields.serviceLabel.value.trim(),
      message_title: weeklyFields.messageTitle.value.trim(),
      scripture: weeklyFields.scripture.value.trim(),
      key_sentence: weeklyFields.keySentence.value.trim(),
      daily_prayer: weeklyFields.dailyPrayer.value.trim(),
      prayer_worry: weeklyFields.prayerWorry.value.trim(),
      prayer_hurt: weeklyFields.prayerHurt.value.trim(),
      prayer_anger: weeklyFields.prayerAnger.value.trim(),
      prayer_courage: weeklyFields.prayerCourage.value.trim(),
      prayer_thanks: weeklyFields.prayerThanks.value.trim(),
      prayer_friend: weeklyFields.prayerFriend.value.trim(),
      is_published: weeklyFields.isPublished.checked,
      updated_at: new Date().toISOString()
    };
  }

  async function saveWeeklyContent(event){
    event.preventDefault();
    weeklyStatus.textContent = "저장 중…";

    const payload = weeklyPayload();
    if (!payload.message_date || !payload.message_title || !payload.service_label) {
      weeklyStatus.textContent = "주일 날짜, 예배 구분, 메시지 제목을 입력해 주세요.";
      return;
    }

    let query;
    const id = weeklyFields.id.value;
    if (id) {
      query = client
        .from("weekly_content")
        .update(payload)
        .eq("id", id)
        .select()
        .single();
    } else {
      query = client
        .from("weekly_content")
        .upsert(payload, { onConflict:"message_date" })
        .select()
        .single();
    }

    const { data, error } = await query;
    if (error) {
      weeklyStatus.textContent = "저장하지 못했습니다: " + error.message;
      console.error(error);
      return;
    }

    fillWeeklyForm(data);
    weeklyStatus.textContent = data.is_published
      ? "저장하고 공개했습니다. 사용자 페이지 새로고침 후 반영됩니다."
      : "임시 저장했습니다. 공개 체크 전에는 사용자 페이지에 보이지 않습니다.";
    await loadWeeklyHistory();
  }

  async function loadWeeklyHistory(){
    weeklyHistory.innerHTML = '<div class="empty">불러오는 중…</div>';

    const { data, error } = await client
      .from("weekly_content")
      .select("*")
      .order("message_date", { ascending:false })
      .limit(12);

    if (error) {
      weeklyHistory.innerHTML = '<div class="empty">주간 관리 SQL을 먼저 실행해 주세요.</div>';
      console.error(error);
      return;
    }

    weeklyHistory.innerHTML = "";
    if (!data.length) {
      weeklyHistory.innerHTML = '<div class="empty">아직 저장된 주간 메시지가 없습니다.</div>';
      fillWeeklyForm(null);
      return;
    }

    data.forEach(row => {
      const item = document.createElement("div");
      item.className = "history-item";

      const main = document.createElement("div");
      main.className = "history-main";

      const title = document.createElement("div");
      title.className = "history-title";
      title.textContent = row.message_title || "(제목 없음)";

      if (row.is_published) {
        const badge = document.createElement("span");
        badge.className = "published-badge";
        badge.textContent = "공개";
        title.appendChild(badge);
      }

      const meta = document.createElement("div");
      meta.className = "history-meta";
      meta.textContent = [row.message_date, row.service_label, row.scripture]
        .filter(Boolean)
        .join(" · ");

      const edit = document.createElement("button");
      edit.className = "secondary";
      edit.type = "button";
      edit.textContent = "불러오기";
      edit.addEventListener("click", () => {
        fillWeeklyForm(row);
        weeklyPanel.scrollIntoView({behavior:"smooth", block:"start"});
      });

      main.append(title, meta);
      item.append(main, edit);
      weeklyHistory.append(item);
    });

    if (!weeklyFields.id.value) fillWeeklyForm(data[0]);
  }

  weeklyForm.addEventListener("submit", saveWeeklyContent);
  document.getElementById("newWeekBtn").addEventListener("click", () => {
    fillWeeklyForm({
      ...fallbackWeekly,
      message_date:todayDate(),
      is_published:false
    });
    weeklyFields.messageTitle.focus();
  });

  async function loadPrayers(){
    adminStatus.textContent = "";
    prayerList.innerHTML = '<div class="empty">불러오는 중…</div>';

    const [{ data, error }, reportResult] = await Promise.all([
      client
        .from("anonymous_prayers")
        .select("id,content,created_at")
        .order("created_at", { ascending:false }),
      client
        .from("prayer_reports")
        .select("prayer_id")
    ]);

    if (error) {
      prayerList.innerHTML = "";
      adminStatus.textContent = "기도제목을 불러오지 못했습니다. 관리자 권한과 RLS 정책을 확인해 주세요.";
      console.error(error);
      return;
    }

    const reportCounts = {};
    if (!reportResult.error && reportResult.data) {
      reportResult.data.forEach(item => {
        reportCounts[item.prayer_id] = (reportCounts[item.prayer_id] || 0) + 1;
      });
    }

    countText.textContent = `총 ${data.length}개의 기도제목`;
    prayerList.innerHTML = "";

    if (!data.length) {
      prayerList.innerHTML = '<div class="empty">아직 등록된 기도제목이 없습니다.</div>';
      return;
    }

    data.forEach(row => {
      const item = document.createElement("article");
      item.className = "item";

      const body = document.createElement("div");
      const content = document.createElement("div");
      content.className = "content";
      content.textContent = row.content;

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = formatDate(row.created_at);

      const reports = reportCounts[row.id] || 0;
      if (reports > 0) {
        const badge = document.createElement("span");
        badge.className = "report-badge";
        badge.textContent = `신고 ${reports}건`;
        meta.appendChild(badge);
      }

      body.append(content, meta);

      const del = document.createElement("button");
      del.className = "danger";
      del.type = "button";
      del.textContent = "삭제";
      del.addEventListener("click", async function(){
        if (!confirm("이 익명 기도제목을 삭제할까요? 삭제 후 복구할 수 없습니다.")) return;
        del.disabled = true;
        const { error } = await client
          .from("anonymous_prayers")
          .delete()
          .eq("id", row.id);

        if (error) {
          adminStatus.textContent = "삭제하지 못했습니다.";
          del.disabled = false;
          console.error(error);
          return;
        }
        item.remove();
        await loadPrayers();
      });

      item.append(body, del);
      prayerList.append(item);
    });
  }

  document.getElementById("loginForm").addEventListener("submit", async function(e){
    e.preventDefault();
    loginStatus.textContent = "로그인 중…";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const { error } = await client.auth.signInWithPassword({ email, password });

    if (error) {
      loginStatus.textContent = "이메일 또는 비밀번호를 확인해 주세요.";
      return;
    }

    if (await verifyAdmin()) {
      await Promise.all([loadWeeklyHistory(), loadPrayers()]);
    }
  });

  document.getElementById("refreshBtn").addEventListener("click", loadPrayers);
  document.getElementById("logoutBtn").addEventListener("click", async function(){
    await client.auth.signOut();
    showLogin("");
  });

  verifyAdmin().then(ok => {
    if (ok) Promise.all([loadWeeklyHistory(), loadPrayers()]);
  });
})();
</script>
</body>
</html>
